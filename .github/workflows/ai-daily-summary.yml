# JST 06:50 ≒ UTC 21:50 (previous calendar day in UTC) — before the 07:00 JST bulk refresh;
# slot 01 for the summarized business_day is written by the 01:00 job on the next calendar day.
name: AI daily summary

on:
  schedule:
    - cron: "50 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install "requests>=2.31" "psycopg2-binary>=2.9" "python-dotenv>=0.19"

      # DATABASE_URL with *.flycast does not resolve on GitHub-hosted runners.
      # Snapshots are read from production /api/summaries/daily-snapshots (same DB on Fly).
      - name: Generate summary (HTTP snapshots + OpenAI)
        env:
          TREND_DASHBOARD_BASE_URL: https://trends-dashboard.fly.dev
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_ai_daily_summary.py --from-api --write --force

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/summaries/daily/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "docs(summaries): ai daily summary"
          git push
