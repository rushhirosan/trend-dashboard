# JST 06:50 ≒ UTC 21:50 (previous calendar day in UTC) — before the 07:00 JST bulk refresh.
# Writes JP docs/summaries/daily/{yesterday}.md and US docs/summaries/daily/us/{yesterday}.md.
# slot 01 for that business_day is written by the 01:00 job on the next calendar day.
name: AI daily summary

on:
  schedule:
    - cron: "50 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install "requests>=2.31" "psycopg2-binary>=2.9" "python-dotenv>=0.19"

      # Writes daily markdown and companion .generation.json (--write). On failure we still
      # record .generation.json; continue-on-error so Commit can push the status file, then we fail the job.
      - name: Generate JP daily summary
        id: summarize_jp
        continue-on-error: true
        env:
          TREND_DASHBOARD_BASE_URL: https://trends-dashboard.fly.dev
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_ai_daily_summary.py --from-api --write --force --region jp

      - name: Generate US daily summary
        id: summarize_us
        continue-on-error: true
        env:
          TREND_DASHBOARD_BASE_URL: https://trends-dashboard.fly.dev
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_ai_daily_summary.py --from-api --write --force --region us

      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/summaries/daily/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "docs(summaries): ai daily summary (jp+us)"
          # main が進んでいると rejected になるので、rebase してから push（リトライ付き）
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $i); retrying..."
            sleep 5
          done
          echo "git push failed after retries"
          exit 1

      # 閲覧ページは DB（summary_documents）を優先して読むため、ここで upsert すれば
      # fly deploy なしで当日分が公開される。片方の生成が失敗しても揃った分は送る。
      - name: Publish summaries to site (DB)
        if: always()
        env:
          TREND_DASHBOARD_BASE_URL: https://trends-dashboard.fly.dev
          SUMMARY_UPSERT_TOKEN: ${{ secrets.SUMMARY_UPSERT_TOKEN }}
        run: |
          if [ -z "$SUMMARY_UPSERT_TOKEN" ]; then
            echo "::warning::SUMMARY_UPSERT_TOKEN not set; skipping site publish (set the secret to enable deploy-less publishing)"
            exit 0
          fi
          python scripts/publish_summaries_to_site.py

      - name: Fail if either summary step failed
        if: steps.summarize_jp.outcome == 'failure' || steps.summarize_us.outcome == 'failure'
        run: exit 1
