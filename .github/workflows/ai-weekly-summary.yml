# Reads 7 days of trend_daily_snapshots for the prior ISO week (W1).
# Sun's JP daily lands Mon 06:50 JST (ai-daily-summary); this job runs Mon 07:30 JST (W2 delivery week).
# JP → docs/summaries/weekly/{ISO}.md ; US → docs/summaries/weekly/us/{ISO}.md
# If jp+us are already in summary_documents (e.g. manual Run then delayed cron), skip all work.
name: AI weekly summary

on:
  schedule:
    - cron: "30 22 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even if already published in DB"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "requests>=2.31" "psycopg2-binary>=2.9" "python-dotenv>=0.19" "pytz>=2023.3" "yfinance>=0.2.0"

      - name: Skip if already published
        id: already
        env:
          TREND_DASHBOARD_BASE_URL: https://trends-dashboard.com
          SUMMARY_UPSERT_TOKEN: ${{ secrets.SUMMARY_UPSERT_TOKEN }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG=--force
          fi
          python scripts/check_summary_already_published.py --kind weekly --github-output $FORCE_FLAG

      - name: Generate JP weekly summary
        if: steps.already.outputs.skip != 'true'
        env:
          TREND_DASHBOARD_BASE_URL: https://trends-dashboard.com
        run: python scripts/generate_ai_weekly_summary.py --from-api --write --force --region jp

      - name: Generate US weekly summary
        if: steps.already.outputs.skip != 'true'
        env:
          TREND_DASHBOARD_BASE_URL: https://trends-dashboard.com
        run: python scripts/generate_ai_weekly_summary.py --from-api --write --force --region us

      - name: Commit if changed
        if: steps.already.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/summaries/weekly/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "docs(summaries): mechanical weekly summary (jp+us)"
          # main が進んでいると rejected になるので、rebase してから push（リトライ付き）
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $i); retrying..."
            sleep 5
          done
          echo "git push failed after retries"
          exit 1

      # 閲覧ページは DB（summary_documents）を優先して読むため、deploy なしで反映される。
      - name: Publish summaries to site (DB)
        if: always() && steps.already.outputs.skip != 'true'
        env:
          TREND_DASHBOARD_BASE_URL: https://trends-dashboard.com
          SUMMARY_UPSERT_TOKEN: ${{ secrets.SUMMARY_UPSERT_TOKEN }}
        run: |
          if [ -z "$SUMMARY_UPSERT_TOKEN" ]; then
            echo "::warning::SUMMARY_UPSERT_TOKEN not set; skipping site publish (set the secret to enable deploy-less publishing)"
            exit 0
          fi
          python scripts/publish_summaries_to_site.py

      # 自分宛 dogfood（draft 可）。Resend（検証=本番と同じ経路）。Secrets 未設定ならスキップ。
      - name: Dogfood email (weekly JP+US)
        if: always() && steps.already.outputs.skip != 'true'
        env:
          EMAIL_PROVIDER: resend
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SUMMARY_DOGFOOD_TO: ${{ secrets.SUMMARY_DOGFOOD_TO }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$RESEND_FROM_EMAIL" ]; then
            echo "::notice::dogfood email skipped (set secrets RESEND_API_KEY + RESEND_FROM_EMAIL; optional SUMMARY_DOGFOOD_TO)"
            exit 0
          fi
          python scripts/send_summary_dogfood_email.py --kind weekly --regions jp,us

      # 有料購読者へ（dogfood の後）。購読者は本番 API（SUMMARY_UPSERT_TOKEN）。
      - name: Paid subscriber email (weekly)
        if: always() && steps.already.outputs.skip != 'true'
        env:
          EMAIL_PROVIDER: resend
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          TREND_DASHBOARD_BASE_URL: https://trends-dashboard.com
          SUMMARY_UPSERT_TOKEN: ${{ secrets.SUMMARY_UPSERT_TOKEN }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$RESEND_FROM_EMAIL" ]; then
            echo "::notice::paid email skipped (set secrets RESEND_API_KEY + RESEND_FROM_EMAIL)"
            exit 0
          fi
          if [ -z "$SUMMARY_UPSERT_TOKEN" ]; then
            echo "::notice::paid email skipped (set secret SUMMARY_UPSERT_TOKEN)"
            exit 0
          fi
          python scripts/send_summary_paid_email.py --kind weekly --from-api
