# Discord 通知は Fly 19時ジョブ完了後 (services/daily_x_post_notify.py)。
# この workflow は docs 更新用。手動実行のみ。
name: Daily X post series

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script dependencies
        run: pip install "requests>=2.31" "psycopg2-binary>=2.9"

      # DATABASE_URL with *.flycast (Fly private DNS) does not resolve on GitHub-hosted
      # runners. Read the same trend_daily_snapshots rows as AI daily summary via
      # GET /api/summaries/daily-snapshots?business_day=… (slots 07/13/19).
      - name: Fill today's block (daily-snapshots API)
        env:
          TREND_DASHBOARD_BASE_URL: https://trends-dashboard.fly.dev
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: >-
          python scripts/generate_daily_x_post_series.py --from-api --write --discord
          --require-slots 07,13,19 --wait-for-slots 600 --poll-interval 60

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/x_post_samples/daily/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "docs(x_post): auto-fill daily X post series"
          git push
