# JST 20:10 ≒ UTC 11:10 — after the 19:00 JST scheduler run has time to finish.
name: Daily X post series

on:
  schedule:
    - cron: "10 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script dependencies
        run: pip install "requests>=2.31" "psycopg2-binary>=2.9"

      # DATABASE_URL with *.flycast (Fly private DNS) does not resolve on GitHub-hosted
      # runners. Read the same trend_daily_snapshots rows as AI daily summary via
      # GET /api/summaries/daily-snapshots?business_day=… (slots 07/13/19).
      - name: Fill today's block (daily-snapshots API)
        env:
          TREND_DASHBOARD_BASE_URL: https://trends-dashboard.fly.dev
        run: python scripts/generate_daily_x_post_series.py --from-api --write

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/x_post_samples/daily_series_from_2026-05-09.md; then
            echo "No changes to commit."
            exit 0
          fi
          git add docs/x_post_samples/daily_series_from_2026-05-09.md
          git commit -m "docs(x_post): auto-fill daily X post series"
          git push
