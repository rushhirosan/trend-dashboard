# JST 08:00 ≒ UTC 23:00 (previous calendar day).
# Runs after AI daily summary (06:50 JST) and weekly (Mon 07:30 JST).
# Deletes docs/summaries/daily/*.md (+ .generation.json) and weekly/*.md past retention.
name: Summary retention purge

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "python-dotenv>=0.19" "psycopg2-binary>=2.9" "pytz>=2023.3"

      - name: Purge expired summary drafts
        run: python scripts/purge_snapshot_retention.py --summaries-only

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/summaries/daily/ docs/summaries/weekly/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "docs(summaries): purge expired drafts"
          git push
