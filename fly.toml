app = "trends-dashboard"
primary_region = "nrt"

[build]

[env]
  PORT = "8080"
  FLASK_PORT = "8080"
  DEBUG = "False"
  # スケジューラ二重実行防止: DB分散ロックを有効化（複数マシン・プロセスで1本のみ実行）
  TRENDS_SCHEDULER_USE_DB_LOCK = "true"
  # 起動時の全量 catchup はしない（OOM 再取得ループ防止）。未完了スロットは delayed gap_retry で補完
  SKIP_STARTUP_EXECUTION = "true"
  # デプロイ時のメール送信を無効化（スケジューラー実行時のみメール送信）
  SKIP_EMAIL_ON_UPDATE = "false"
  # DB分散ロックの保持時間（分）。一括取得が長時間でも期限切れで二重実行されないよう、想定最長ジョブより長めに
  TRENDS_SCHEDULER_LOCK_MINUTES = "90"
  # トレンド取得の同時実行数（手動/API用。スケジューラは TRENDS_SCHEDULER_LOW_MEMORY_* を使用）
  TREND_REFRESH_MAX_CONCURRENT = "2"
  # スケジューラ定期実行: 同時1本で OOM 回避（2026-05-30: 768MB+concurrent=2 で anon-rss~600MB→SIGKILL）
  TRENDS_SCHEDULER_LOW_MEMORY_MAX_CONCURRENT = "1"
  TRENDS_SCHEDULER_LOW_MEMORY_BATCH_DELAY_SECONDS = "10"
  # 定時 refresh を JP/US で subprocess 分割（全カテゴリ取得維持・RSS ピーク低減）
  TRENDS_SCHEDULER_SUBPROCESS_PHASES = "true"
  # JP を 8 subprocess に分割（kkj/note 単独 chunk・重量源分散）
  TRENDS_SCHEDULER_JP_SUBCHUNKS = "8"
  # subprocess フェーズ間: 親の gc/malloc_trim + cgroup 安定待ち（秒）
  TRENDS_SCHEDULER_SUBPROCESS_PHASE_PAUSE_SECONDS = "8"
  # US subprocess 専用上限（JP 分割数増加時も US を 600s に押し潰さない）
  TRENDS_SCHEDULER_US_SUBPROCESS_TIMEOUT_SECONDS = "2400"
  # 官公需ランキング取得件数（subprocess 低メモリ時。県別 Top5 には 150 件で十分）
  KKJ_RANKING_FETCH_COUNT = "150"
  # 官公需の連続取得を JP chunk 上限(600s)より前に打ち切り、stale cache を返す
  KKJ_FETCH_DEADLINE_SECONDS = "480"
  # memory_watchdog の fallback 上限（cgroup と揃える）
  MEMORY_LIMIT_MB = "1536"
  # memory_watchdog: cgroup 全体（subprocess 含む）を 5s 間隔で監視
  DISCORD_MEMORY_PRESSURE_ALERT = "true"
  MEMORY_WATCHDOG_INTERVAL_SEC = "5"
  MEMORY_PRESSURE_WARN_RATIO = "0.75"
  MEMORY_PRESSURE_CRITICAL_RATIO = "0.88"
  MEMORY_PRESSURE_ALERT_COOLDOWN_SEC = "600"
  # バッチ間待機秒数（メモリ・接続の解放を待つ、OOM対策）
  TREND_REFRESH_BATCH_DELAY_SECONDS = "3"
  # 完了通知のみ（開始通知はオフ）
  DISCORD_NOTIFY_SCHEDULER_START = "false"
  # 1ソースあたりの最大待ち（秒）。ハング時にバッチが止まらないよう上限
  TREND_REFRESH_TASK_TIMEOUT_SECONDS = "600"
  # ジョブ全体の上限（秒）。DBロック(90分)より短くし、フラグ解放と完了通知を保証
  TRENDS_SCHEDULER_JOB_TIMEOUT_SECONDS = "5100"
  # OOM ロック回収がこの回数に達したら当該スロットの自動再取得を停止
  TRENDS_SCHEDULER_OOM_RECOVERY_CIRCUIT_THRESHOLD = "3"
  # サマリー用スナップショット保持（business_day ベース）。週次7日+余裕で既定10日
  TREND_SNAPSHOT_RETENTION_DAYS = "10"
  TREND_SNAPSHOT_RETENTION_ENABLED = "true"
  # 株・暗号を日次スナップショットに含める（マーケットタブと同ソース）
  TREND_SNAPSHOT_EXCLUDE_MARKET = "false"
  # docs/summaries 原稿（Fly 上はデプロイ時点のファイルのみ。git 反映は手元実行）
  SUMMARY_DAILY_RETENTION_DAYS = "10"
  SUMMARY_WEEKLY_RETENTION_DAYS = "30"
  # AI サマリーは現状 status:draft のみ生成され approved 化の自動運用が無いため、
  # 本番でも draft を公開する（未指定だと DEBUG=False → approved のみ → 一覧が空になる）。
  # 人手レビュー gate を再導入する場合はここを false に戻す。
  AI_SUMMARY_FAKE_DOOR_ALLOW_DRAFT = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # スケジューラーを止めないため常時稼働
  auto_start_machines = true  # 外部cronサービスからのリクエストで自動起動
  min_machines_running = 1
  max_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "120s"  # データベーススリープ・マネージャー初期化の時間を考慮
    interval = "60s"
    method = "GET"
    timeout = "30s"
    path = "/healthz"

# デプロイ直後にデプロイ時刻をDBに記録（起動時補完は「直近デプロイならスキップ」でデプロイとクラッシュを区別）
[deploy]
  release_command = "python scripts/record_deploy.py"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # 1536MB: 1024MB 運用で JP chunk OOM が再発したため一時的に戻す
  memory_mb = 1536
