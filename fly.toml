app = "trends-dashboard"
primary_region = "nrt"

[build]

[env]
  PORT = "8080"
  FLASK_PORT = "8080"
  DEBUG = "False"
  # スケジューラ二重実行防止: DB分散ロックを有効化（複数マシン・プロセスで1本のみ実行）
  TRENDS_SCHEDULER_USE_DB_LOCK = "true"
  # 起動時の取り逃し補完を有効化
  SKIP_STARTUP_EXECUTION = "false"
  # デプロイ時のメール送信を無効化（スケジューラー実行時のみメール送信）
  SKIP_EMAIL_ON_UPDATE = "false"
  # トレンド取得の同時実行数（OOM対策）
  TREND_REFRESH_MAX_CONCURRENT = "3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # スケジューラーを止めないため常時稼働
  auto_start_machines = true  # 外部cronサービスからのリクエストで自動起動
  min_machines_running = 1
  max_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "90s"  # データベーススリープからの復帰時間を考慮して延長
    interval = "60s"
    method = "GET"
    timeout = "30s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
