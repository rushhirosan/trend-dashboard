{# 日次/週次サマリーのロック領域用: メール配信 CTA + 案内モーダル。
   waitlist は準備中のため fake door（登録フォームは出さず案内のみ）。Bootstrap bundle だけで動作する。 #}
<div class="mt-3 d-flex flex-wrap align-items-center gap-2">
  <button type="button" class="btn btn-primary btn-sm" id="summary-email-cta"
      data-bs-toggle="modal" data-bs-target="#summaryEmailModal">
    <i class="fas fa-envelope me-1" aria-hidden="true"></i>メール配信を希望する
  </button>
  <span class="small text-muted">提供準備中</span>
</div>

<div class="modal fade" id="summaryEmailModal" tabindex="-1" aria-labelledby="summaryEmailModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="summaryEmailModalLabel">サマリー配信（日次・週次）</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
      </div>
      <div class="modal-body">
        <p class="small mb-2">日次は毎朝10:30 JST頃、週次は毎週月曜11:00 JST頃を目安に、論点・順位の動き・カテゴリ別トップをメールでお届けする予定です（有料・開始時期未定）。</p>
        <p class="small text-muted mb-0">配信の準備が整い次第、事前登録を開始します。現時点では登録はお受けしていません。</p>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">閉じる</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  function ga(name) { if (typeof gtag === 'function') gtag('event', name, { location: 'summary_locked_email_cta' }); }
  var cta = document.getElementById('summary-email-cta');
  var modal = document.getElementById('summaryEmailModal');
  if (cta) cta.addEventListener('click', function () { ga('ai_summary_top5_click'); });
  if (modal) modal.addEventListener('shown.bs.modal', function () { ga('fake_door_view'); });
})();
</script>
