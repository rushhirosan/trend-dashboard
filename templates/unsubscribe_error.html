<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配信停止エラー - トレンドサマリー</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="apple-touch-icon" sizes="512x512" href="{{ url_for('static', filename='images/icon-512.png') }}">
    {% include 'partials/vendor_assets.html' %}
    <link href="{{ url_for('static', filename='css/common.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body text-center">
                        <div class="mb-4">
                            <i class="fas fa-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
                        </div>
                        <h2 class="card-title text-danger mb-3">配信停止エラー</h2>
                        <p class="card-text lead">{{ error or '配信停止の処理中にエラーが発生しました。' }}</p>
                        <p class="text-muted">しばらく時間をおいてから再度お試しください。</p>
                        <div class="mt-4">
                            <a href="/subscription/" class="btn btn-primary">サブスクリプション設定に戻る</a>
                            <a href="/" class="btn btn-secondary">ダッシュボードに戻る</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script defer src="{{ url_for('static', filename='vendor/bootstrap/5.1.3/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
