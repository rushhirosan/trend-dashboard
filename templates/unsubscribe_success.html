<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配信停止完了 - トレンドサマリー</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="apple-touch-icon" sizes="512x512" href="{{ url_for('static', filename='images/icon-512.png') }}">
    {% include 'partials/vendor_assets.html' %}
    <link href="{{ url_for('static', filename='css/common.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body text-center">
                        <div class="mb-4">
                            <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
                        </div>
                        <h2 class="card-title text-success mb-3">配信停止完了</h2>
                        <p class="card-text lead">{{ message or 'トレンドサマリーの配信を停止しました。' }}</p>
                        <p class="text-muted">ご利用いただき、ありがとうございました。</p>
                        <div class="mt-4">
                            <a href="/" class="btn btn-primary">ダッシュボードに戻る</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script defer src="{{ url_for('static', filename='vendor/bootstrap/5.1.3/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
